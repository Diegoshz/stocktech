<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockTech — Tecnologia sob controle</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Tela de login -->
  <section id="tela-login" class="login">
    <form id="form-login" class="cartao login-caixa">
      <img class="logo-login" src="logo-stocktech - Copia.png" alt="StockTech — Controle de Estoque Inteligente">
      <p class="sub">Controle de estoque inteligente.</p>
      <div id="erro-login" class="alerta erro oculto"></div>
      <label>E-mail <input type="email" id="login-email" required></label>
      <label>Senha <input type="password" id="login-senha" required></label>
      <button class="btn">Entrar</button>
      <small class="dica">Teste: admin@stocktech.com, funcionario@stocktech.com ou visitante@stocktech.com — senha admin123</small>
    </form>
  </section>

  <!-- Sistema (aparece depois do login) -->
  <div id="sistema" class="oculto">
    <header class="topo">
      <strong class="marca"><img src="logo-stocktech - Copia.png" alt="StockTech"><span>StockTech</span></strong>
      <button id="btn-menu" class="btn-menu">☰</button>
      <nav id="menu">
        <a href="#painel">Painel</a>
        <a href="#produtos">Produtos</a>
        <a href="#categorias" data-perfil="administrador">Categorias</a>
        <a href="#movimentar" data-perfil="administrador funcionario">Entrada/Saída</a>
        <a href="#historico" data-perfil="administrador funcionario">Histórico</a>
        <a href="#relatorios" data-perfil="administrador">Relatórios</a>
        <span id="usuario-logado"></span>
        <a href="#" id="btn-sair">Sair</a>
      </nav>
    </header>
    <div id="mensagem"></div>
    <main id="conteudo"></main>
  </div>

  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
